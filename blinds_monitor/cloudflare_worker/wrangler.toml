name = "blinds-price-monitor"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# KV Namespace for storing price history
[[kv_namespaces]]
binding = "PRICE_DATA"
id = "your-kv-namespace-id"

# Cron trigger - runs daily at 8:00 AM UTC
[triggers]
crons = ["0 8 * * *"]

# Environment variables (set via wrangler secret)
# SMTP_USERNAME, SMTP_PASSWORD, RECIPIENT_EMAIL
